<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroWiki Consciousness Graph (Premium Organic)</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --text-color: #c5c6c7;
            --panel-bg: rgba(11, 12, 16, 0.9);
            --border-color: rgba(102, 252, 241, 0.2);
            --accent: #66fcf1;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }

        #graph-container { width: 100%; height: 100%; cursor: grab; }
        #graph-container:active { cursor: grabbing; }

        /* Premium Floating Sidebar */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: none;
            z-index: 100;
        }

        .panel {
            pointer-events: auto;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 240px;
        }

        h2 { font-size: 0.9rem; margin: 0 0 10px 0; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
        .control-group { margin-bottom: 10px; }
        label { font-size: 0.75rem; display: block; margin-bottom: 5px; opacity: 0.8; }
        input[type=range] { width: 100%; accent-color: var(--accent); }

        #detail-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 350px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .node-label { font-size: 10px; pointer-events: none; text-shadow: 0 0 4px #000; fill: #fff; opacity: 0.6; }

        /* Glow Filter */
        .node { stroke-width: 0px; filter: drop-shadow(0 0 5px var(--glow-color)); cursor: pointer; transition: stroke-width 0.2s; }
        .node:hover { stroke: #fff; stroke-width: 1.5px; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="panel">
            <h2>System Architecture</h2>
            <div id="status-text" style="font-size: 0.8rem;">State: Active Phase</div>
            <button onclick="location.reload()" style="margin-top:10px; width:100%; background:transparent; border:1px solid var(--accent); color:var(--accent); cursor:pointer; padding:5px; border-radius:4px;">Force Re-Scan</button>
        </div>

        <div class="panel">
            <h2>Organic Forces</h2>
            <div class="control-group">
                <label>Repulsion (Collision)</label>
                <input type="range" id="repel" min="-1000" max="0" value="-300">
            </div>
            <div class="control-group">
                <label>Bond Length (Links)</label>
                <input type="range" id="distance" min="20" max="300" value="100">
            </div>
            <div class="control-group">
                <label>Gravity (Centering)</label>
                <input type="range" id="gravity" min="0" max="1" step="0.1" value="0.3">
            </div>
        </div>
    </div>

    <div id="detail-panel" class="panel">
        <h2 id="detail-title">Neuron Identified</h2>
        <p id="detail-summary" style="font-size:0.85rem; line-height:1.5;"></p>
        <div id="detail-path" style="font-size:0.7rem; opacity:0.5; font-style:italic;"></div>
    </div>

    <div id="graph-container"></div>
    <div id="error-screen" style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); display:none; text-align:center;">
        <h1 style="color:#ff3300;">Visualizer Offline</h1>
        <p>Could not load brain data or D3 library.</p>
        <button class="refresh-btn" onclick="location.reload()">Retry Connection</button>
    </div>
    <div class="tooltip"></div>

    <!-- The Zero-Config Data Injection -->
    <script src="brain_data.js"></script>

    <script>
        // Check for Data & Library
        if (typeof d3 === 'undefined' || typeof window.BRAIN_DATA === 'undefined') {
            document.getElementById('error-screen').style.display = 'block';
        }

        const data = window.BRAIN_DATA || { nodes: [], links: [], settings: { colors: {}, physics: {} } };
        
        // Data Integrity Check: Filter out links to non-existent nodes
        const nodeIds = new Set(data.nodes.map(n => n.id));
        const validLinks = data.links.filter(l => nodeIds.has(l.source) && nodeIds.has(l.target));

        const conf = data.settings || { colors: {}, physics: {} };
        const width = window.innerWidth;
        const height = window.innerHeight;

        const svg = d3.select("#graph-container")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const g = svg.append("g");

        // Zoom Behavior
        svg.call(d3.zoom().on("zoom", (event) => g.attr("transform", event.transform)));

        const simulation = d3.forceSimulation(data.nodes)
            .force("link", d3.forceLink(validLinks).id(d => d.id).distance(conf.physics.link_distance || 100))
            .force("charge", d3.forceManyBody().strength(conf.physics.repel_force || -300))
            .force("center", d3.forceCenter(width / 2, height / 2).strength(conf.physics.center_gravity || 0.3))
            .force("collision", d3.forceCollide().radius(d => 25 + (d.weight / 10)))
            .alphaDecay(0.02); // Slower decay = more organic motion

        const link = g.append("g")
            .selectAll("line")
            .data(validLinks)
            .enter().append("line")
            .attr("stroke", d => d.type === "callosum" ? "#fff" : "rgba(102, 252, 241, 0.1)")
            .attr("stroke-width", d => d.type === "callosum" ? 1.5 : 1)
            .attr("stroke-dasharray", d => d.type === "prereq" ? "5,5" : "0");

        const node = g.append("g")
            .selectAll("circle")
            .data(data.nodes)
            .enter().append("circle")
            .attr("class", "node")
            .attr("r", d => 10 + (d.weight / 15))
            .attr("fill", d => conf.colors[d.group] || "#fff")
            .style("--glow-color", d => conf.colors[d.group] || "#fff")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended))
            .on("click", (event, d) => {
                d3.select("#detail-panel").style("display", "block");
                d3.select("#detail-title").text(d.id);
                d3.select("#detail-summary").text(d.summary);
                d3.select("#detail-path").text(d.path);
                
                // Highlight Neighbors
                const neighbors = new Set(data.links.filter(l => l.source.id === d.id || l.target.id === d.id).flatMap(l => [l.source.id, l.target.id]));
                node.style("opacity", n => neighbors.has(n.id) || n.id === d.id ? 1 : 0.1);
                link.style("stroke-opacity", l => l.source.id === d.id || l.target.id === d.id ? 1 : 0.05);
            });

        // Click background to reset view
        svg.on("click", (event) => {
            if (event.target.tagName === "svg") {
                node.style("opacity", 1);
                link.style("stroke-opacity", (l) => l.type === "callosum" ? 1 : 0.2);
                d3.select("#detail-panel").style("display", "none");
            }
        });

        const labels = g.append("g")
            .selectAll("text")
            .data(data.nodes)
            .enter().append("text")
            .attr("class", "node-label")
            .attr("dy", 20)
            .attr("text-anchor", "middle")
            .text(d => d.id);

        simulation.on("tick", () => {
            link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
            node.attr("cx", d => d.x).attr("cy", d => d.y);
            labels.attr("x", d => d.x).attr("y", d => d.y);
        });

        // UI Listeners
        d3.select("#repel").on("input", (e) => simulation.force("charge").strength(+e.target.value).alphaTarget(0.1).restart());
        d3.select("#distance").on("input", (e) => simulation.force("link").distance(+e.target.value).alphaTarget(0.1).restart());
        d3.select("#gravity").on("input", (e) => simulation.force("center").strength(+e.target.value).alphaTarget(0.1).restart());

        function dragstarted(event, d) { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
        function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
        function dragended(event, d) { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }

        window.addEventListener('resize', () => {
            svg.attr("width", window.innerWidth).attr("height", window.innerHeight);
            simulation.force("center", d3.forceCenter(window.innerWidth / 2, window.innerHeight / 2)).restart();
        });
    </script>
</body>
</html>
